<!doctype html>
<html lang="en" style="width: 100%; height: 100%;">
<head>
  <meta charset="utf-8">
  <title>MuTech-IoT</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
  <link rel="preload" href="assets/fonts/MaterialIconsRound-Regular.otf" as="font" type="font/otf" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/fonts/material-icons.css" />
  <style type="text/css">

    body, html {
      height: 100%;
      overflow: hidden;
      background-color: var(--mt-boot-bg);
    }

    /* MuTech-IoT start-up screen, shown until the first page renders. */
    :root {
      --mt-boot-bg: #F4F5FA;
      --mt-boot-text: #15142B;
      --mt-boot-accent: #4F46E5;
      --mt-boot-accent-2: #13B5C9;
      --mt-boot-track: rgba(79, 70, 229, 0.14);
      --mt-boot-glow: rgba(79, 70, 229, 0.10);
    }

    .mt-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 42%, var(--mt-boot-glow), transparent 46%), var(--mt-boot-bg);
      color: var(--mt-boot-text);
      font-family: Manrope, Roboto, "Helvetica Neue", sans-serif;
      animation: mt-boot-in .4s ease-out both;
    }
    .mt-boot-mark {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mt-boot-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 18%, var(--mt-boot-accent-2) 45%, var(--mt-boot-accent) 75%, transparent 76%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: mt-boot-spin 1.1s linear infinite;
    }
    .mt-boot-track {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid var(--mt-boot-track);
    }
    .mt-boot-mark img {
      width: 72px;
      height: 67px;
      filter: drop-shadow(0 6px 14px rgba(15, 13, 58, 0.28));
      animation: mt-boot-breathe 2.2s ease-in-out infinite;
    }
    .mt-boot-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .mt-boot-name span {
      color: var(--mt-boot-accent);
    }
    .mt-boot-bar {
      position: relative;
      width: 168px;
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--mt-boot-track);
    }
    .mt-boot-bar i {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--mt-boot-accent-2), var(--mt-boot-accent));
      animation: mt-boot-sweep 1.4s cubic-bezier(.65, .05, .36, 1) infinite;
    }

    @keyframes mt-boot-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes mt-boot-breathe {
      0%, 100% { transform: scale(0.94); }
      50% { transform: scale(1); }
    }
    @keyframes mt-boot-sweep {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    @keyframes mt-boot-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mt-boot-ring { animation-duration: 3s; }
      .mt-boot-mark img, .mt-boot-bar i { animation: none; }
      .mt-boot-bar i { left: 30%; }
    }

  </style>
</head>
<body class="tb-default">
  <tb-root></tb-root>
  <div id="tb-loading-spinner" class="mt-boot" role="progressbar" aria-label="Loading MuTech-IoT">
    <div class="mt-boot-mark">
      <div class="mt-boot-track"></div>
      <div class="mt-boot-ring"></div>
      <img src="assets/mutech-emblem.png" alt="">
    </div>
    <div class="mt-boot-name">MuTech<span>-IoT</span></div>
    <div class="mt-boot-bar"><i></i></div>
  </div>
  <script>
    // Paint the start-up screen in the theme the user picked last time (see AppearanceService).
    (function () {
      var themes = {
        indigo: ['#F4F5FA', '#15142B', '#4F46E5', '#13B5C9', 'rgba(79,70,229,0.14)', 'rgba(79,70,229,0.10)'],
        arctic: ['#E8F1F4', '#0D2A33', '#0E7490', '#F59E0B', 'rgba(14,116,144,0.16)', 'rgba(14,116,144,0.10)'],
        midnight: ['#0B0A1F', '#ECEBFF', '#8B87FF', '#22D3EE', 'rgba(139,135,255,0.18)', 'rgba(139,135,255,0.16)'],
        carbon: ['#0E0E0E', '#F2F2F2', '#F5A524', '#38BDF8', 'rgba(245,165,36,0.18)', 'rgba(245,165,36,0.10)']
      };
      var theme = 'indigo';
      try {
        var appearance = JSON.parse(localStorage.getItem('mt_appearance')) || {};
        theme = themes[appearance.theme] ? appearance.theme : 'indigo';
        if (appearance.followSystem && window.matchMedia) {
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var themeDark = theme === 'midnight' || theme === 'carbon';
          if (systemDark && !themeDark) { theme = 'midnight'; }
          if (!systemDark && themeDark) { theme = 'indigo'; }
        }
      } catch (e) {}
      var colors = themes[theme];
      var names = ['bg', 'text', 'accent', 'accent-2', 'track', 'glow'];
      for (var i = 0; i < names.length; i++) {
        document.documentElement.style.setProperty('--mt-boot-' + names[i], colors[i]);
      }
    })();
  </script>
</body>
</html>
