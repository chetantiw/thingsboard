<ul class="tb-side-menu flex flex-col items-stretch justify-start" [class.mt-compact]="compact">
  <li *ngFor="let section of menuSections$ | async; trackBy: trackByMenuSection" [ngSwitch]="section.type === 'link'">
    <tb-menu-link *ngSwitchCase="true" [section]="section" [compact]="compact"></tb-menu-link>
    <tb-menu-toggle *ngSwitchCase="false" [section]="section" [compact]="compact"></tb-menu-toggle>
  </li>
</ul>
